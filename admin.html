<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FF;--card:#fff;--ink:#12153A;--mut:#565C8C;--line:#D5DAF3;--acc:#3355F5;--red:#C2255C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Kantumruy Pro','Noto Sans Khmer',system-ui,sans-serif;padding-bottom:110px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0;font-size:1.15rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:4}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.05rem}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input[type=color]{padding:2px;width:64px}
input[type=checkbox]{width:auto;min-height:0}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}
.btn{min-height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:0 16px;cursor:pointer}
.btn.ghost{background:#EBEEFF;color:var(--ink)}.btn.del{background:#fde7ef;color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#EBEEFF}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;line-height:1}
.pack{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.note{font-size:.85rem;color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.bar .btn{flex:1}
.hint{background:#EBEEFF;border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:14px}
</style>
</head>

<script>
(function(){
  var DEF = JSON.parse(document.getElementById('defaults').textContent);
  var S = null, tab = 'general', DKEY = 'jt-admin-draft';
  var TABS = [['general','ទូទៅ'],['games','ហ្គេម'],['accounts','គណនីលក់'],['khqr','KHQR']];
  var $ = function(s){return document.querySelector(s)};
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function save(){ try{localStorage.setItem(DKEY, JSON.stringify(S))}catch(e){} }

  /* resize image → small data URI (no hosting needed) */
  function pickImage(max, cb, multiple){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !!multiple;
    inp.onchange = function(){
      var files = Array.prototype.slice.call(inp.files), out = [];
      (function next(){
        var f = files.shift(); if(!f){ cb(out); return; }
        var im = new Image(), url = URL.createObjectURL(f);
        im.onload = function(){
          var r = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas');
          cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r);
          var x = cv.getContext('2d'); x.drawImage(im, 0, 0, cv.width, cv.height);
          var png = /png|svg|gif/.test(f.type);
          out.push(cv.toDataURL(png ? 'image/png' : 'image/jpeg', .82)); URL.revokeObjectURL(url); next();
        };
        im.onerror = next; im.src = url;
      })();
    };
    inp.click();
  }

  function bind(root){
    root.querySelectorAll('[data-k]').forEach(function(el){
      el.addEventListener('input', function(){
        var path = el.getAttribute('data-k').split('.'), o = S;
        for(var i = 0; i < path.length - 1; i++) o = o[path[i]];
        var key = path[path.length - 1];
        o[key] = el.type === 'checkbox' ? el.checked : (el.getAttribute('data-n') ? (parseFloat(el.value) || 0) : el.value);
        save();
      });
    });
  }

  function viewGeneral(){
    return '<div class="hint">កែរួច ចុច <b>ទាញយក index.html</b> ហើយយកទៅ upload ជំនួសឯកសារចាស់ក្នុង GitHub។ Vercel នឹងអាប់ដេតគេហទំព័រដោយស្វ័យប្រវត្តិ។</div>' +
    '<div class="card"><h2>ព័ត៌មានហាង</h2>' +
    '<label>ឈ្មោះហាង</label><input data-k="name" value="'+esc(S.name)+'">' +
    '<label>Logo</label><div class="thumbs">' + (S.logo ? '<div><img src="'+S.logo+'" alt=""><button data-act="rmlogo">×</button></div>' : '<span class="note">មិនទាន់មាន logo</span>') + '</div>' +
    '<button class="btn sm" data-act="logo">ជ្រើសរូប Logo</button>' +
    '<label>Telegram username (គ្មាន @)</label><input data-k="telegram" value="'+esc(S.telegram)+'">' +
    '<label>អត្រា ១ ដុល្លារ = ប៉ុន្មានរៀល</label><input data-k="rate" data-n="1" type="number" inputmode="numeric" value="'+esc(S.rate)+'"></div>';
  }

  function viewGames(){
    return S.games.map(function(g,gi){
      return '<div class="card"><h2>'+esc(g.short)+'</h2>' +
      '<label>រូប Item / Cover</label><div class="thumbs">' + (g.img ? '<div><img src="'+g.img+'" alt=""><button data-act="rmgimg" data-i="'+gi+'">×</button></div>' : '<span class="note">ប្រើរូបគំរូស្វ័យប្រវត្តិ</span>') + '</div>' +
      '<button class="btn sm" data-act="gimg" data-i="'+gi+'">ជ្រើសរូប</button>' +
      '<div class="row"><div><label>ឈ្មោះខ្លី</label><input data-k="games.'+gi+'.short" value="'+esc(g.short)+'"></div><div><label>ឈ្មោះពេញ</label><input data-k="games.'+gi+'.name" value="'+esc(g.name)+'"></div></div>' +
      '<div class="row"><div><label>តំបន់</label><input data-k="games.'+gi+'.region" value="'+esc(g.region)+'"></div><div style="flex:none"><label>ពណ៌</label><input type="color" data-k="games.'+gi+'.tint" value="'+esc(g.tint)+'"></div></div>' +
      '<div class="row"><div><label>ឯកតា (EN)</label><input data-k="games.'+gi+'.unit" value="'+esc(g.unit)+'"></div><div><label>ឯកតា (ខ្មែរ)</label><input data-k="games.'+gi+'.unitKm" value="'+esc(g.unitKm)+'"></div></div>' +
      '<label><input type="checkbox" data-k="games.'+gi+'.server" '+(g.server?'checked':'')+'> ត្រូវការ Server ID</label>' +
      '<label>កញ្ចប់ (ចំនួន / តម្លៃ $)</label>' +
      g.packs.map(function(p,pi){ return '<div class="pack"><input type="number" inputmode="decimal" data-n="1" data-k="games.'+gi+'.packs.'+pi+'.0" value="'+p[0]+'"><input type="number" inputmode="decimal" step="0.01" data-n="1" data-k="games.'+gi+'.packs.'+pi+'.1" value="'+p[1]+'"><button class="btn del sm" data-act="rmpack" data-i="'+gi+'" data-j="'+pi+'">×</button></div>'; }).join('') +
      '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="addpack" data-i="'+gi+'">+ កញ្ចប់</button><button class="btn del sm" data-act="rmgame" data-i="'+gi+'">លុបហ្គេមនេះ</button></div></div>';
    }).join('') + '<button class="btn" data-act="addgame" style="width:100%">+ បន្ថែមហ្គេមថ្មី</button>';
  }

  function viewAccounts(){
    return S.accounts.map(function(a,ai){
      return '<div class="card"><h2>'+esc(a.title)+'</h2>' +
      '<label>ចំណងជើង</label><input data-k="accounts.'+ai+'.title" value="'+esc(a.title)+'">' +
      '<div class="row"><div><label>ហ្គេម</label><select data-k="accounts.'+ai+'.game">' + S.games.map(function(g){return '<option value="'+esc(g.id)+'"'+(g.id===a.game?' selected':'')+'>'+esc(g.short)+'</option>'}).join('') + '</select></div>' +
      '<div><label>តម្លៃ $</label><input type="number" inputmode="decimal" step="0.01" data-n="1" data-k="accounts.'+ai+'.usd" value="'+a.usd+'"></div></div>' +
      '<label>ព័ត៌មានលម្អិត (១ ជួរ = ១ ចំណុច)</label><textarea data-specs="'+ai+'" rows="3" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit">'+esc((a.specs||[]).join('\n'))+'</textarea>' +
      '<label>រូបភាពគណនី</label><div class="thumbs">' + (a.images||[]).map(function(im,ii){return '<div><img src="'+im+'" alt=""><button data-act="rmaimg" data-i="'+ai+'" data-j="'+ii+'">×</button></div>'}).join('') + '</div>' +
      '<div class="row"><button class="btn ghost sm" data-act="aimg" data-i="'+ai+'">+ បន្ថែមរូប</button><button class="btn del sm" data-act="rmacc" data-i="'+ai+'">លុបគណនី</button></div></div>';
    }).join('') + '<button class="btn" data-act="addacc" style="width:100%">+ បន្ថែមគណនីលក់</button>';
  }

  function viewKhqr(){
    var k = S.khqr;
    return '<div class="card"><h2>KHQR / ទទួលប្រាក់</h2>' +
    '<label>Bakong Account ID (ឧ. julian@aba)</label><input data-k="khqr.account" value="'+esc(k.account)+'">' +
    '<label>ឈ្មោះអ្នកលក់ (អក្សរឡាតាំង ≤ 25 តួ)</label><input data-k="khqr.name" maxlength="25" value="'+esc(k.name)+'">' +
    '<label>ទីក្រុង</label><input data-k="khqr.city" value="'+esc(k.city)+'">' +
    '<label>រូបិយប័ណ្ណ</label><select data-k="khqr.currency"><option'+(k.currency==='USD'?' selected':'')+'>USD</option><option'+(k.currency==='KHR'?' selected':'')+'>KHR</option></select>' +
    '<label>QR ផុតកំណត់ (នាទី)</label><input type="number" inputmode="numeric" data-n="1" data-k="khqr.expireMin" value="'+esc(k.expireMin)+'">' +
    '<p class="note">⚠️ សាកល្បងស្កេន QR ជាមួយកម្មវិធីធនាគារ មុនបើកលក់ពិត។</p></div>';
  }

  function render(){
    $('#tabs').innerHTML = TABS.map(function(t){ return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>'; }).join('');
    var m = $('#main');
    m.innerHTML = tab === 'general' ? viewGeneral() : tab === 'games' ? viewGames() : tab === 'accounts' ? viewAccounts() : viewKhqr();
    bind(m);
    m.querySelectorAll('[data-specs]').forEach(function(t){
      t.addEventListener('input', function(){ S.accounts[+t.getAttribute('data-specs')].specs = t.value.split('\n').map(function(x){return x.trim()}).filter(Boolean); save(); });
    });
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-tab],[data-act]'); if(!t) return;
    if(t.hasAttribute('data-tab')){ tab = t.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
    var act = t.getAttribute('data-act'), i = +t.getAttribute('data-i'), j = +t.getAttribute('data-j');
    if(act === 'logo') return pickImage(256, function(r){ if(r[0]){ S.logo = r[0]; save(); render(); } });
    if(act === 'rmlogo'){ S.logo = ''; }
    else if(act === 'gimg') return pickImage(320, function(r){ if(r[0]){ S.games[i].img = r[0]; save(); render(); } });
    else if(act === 'rmgimg'){ delete S.games[i].img; }
    else if(act === 'addpack'){ S.games[i].packs.push([0,0]); }
    else if(act === 'rmpack'){ S.games[i].packs.splice(j,1); }
    else if(act === 'rmgame'){ if(!confirm('លុបហ្គេមនេះ?')) return; S.games.splice(i,1); }
    else if(act === 'addgame'){ S.games.push({id:'g'+Date.now(), short:'ហ្គេមថ្មី', name:'New Game', region:'GLOBAL', mono:'NG', tint:'#3355F5', unit:'Diamonds', unitKm:'គ្រាប់ពេជ្រ', server:false, idType:'num', pop:2, packs:[[100,1]]}); }
    else if(act === 'aimg') return pickImage(900, function(r){ S.accounts[i].images = (S.accounts[i].images||[]).concat(r); save(); render(); }, true);
    else if(act === 'rmaimg'){ S.accounts[i].images.splice(j,1); }
    else if(act === 'rmacc'){ if(!confirm('លុបគណនីនេះ?')) return; S.accounts.splice(i,1); }
    else if(act === 'addacc'){ S.accounts.push({game:S.games[0] ? S.games[0].id : '', title:'គណនីថ្មី', specs:[], usd:10, images:[]}); }
    else return;
    save(); render();
  });

  /* mono ស្វ័យប្រវត្តិ ពីឈ្មោះខ្លី បើអត់មាន */
  function finalize(){
    var c = clone(S);
    c.games.forEach(function(g){ if(!g.mono) g.mono = String(g.short||'G').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase() || 'G'; if(!g.img) delete g.img; });
    if(!c.logo) delete c.logo;
    return c;
  }

  $('#dlBtn').addEventListener('click', function(){
    var btn = this; btn.disabled = true;
    fetch('./', {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(html){
      var json = JSON.stringify(finalize()).replace(/</g,'\\u003c');
      var re = /(<script type="application\/json" id="jt-config">)[\s\S]*?(<\/script>)/;
      if(!re.test(html)) throw 1;
      var out = html.replace(re, function(_,a,b){ return a + json + b; });
      var blob = new Blob([out], {type:'text/html'}), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      alert('បានទាញយក index.html (' + Math.round(out.length/1024) + ' KB)។ យកទៅ upload ជំនួសក្នុង GitHub។');
    }).catch(function(){ alert('មិនអាចទាញយកទំព័រដើមបានទេ។ សូមបើក Admin តាម URL ពិតរបស់គេហទំព័រ (https://…vercel.app/admin)។'); })
    .then(function(){ btn.disabled = false; });
  });

  $('#resetBtn').addEventListener('click', function(){
    if(!confirm('លុបការកែដែលមិនទាន់រក្សាទុក ហើយចាប់ផ្តើមពីគេហទំព័របច្ចុប្បន្ន?')) return;
    try{localStorage.removeItem(DKEY)}catch(e){}
    load(true);
  });

  /* ផ្ទុកការកំណត់បច្ចុប្បន្នពីគេហទំព័រ */
  function load(ignoreDraft){
    var draft = null;
    if(!ignoreDraft){ try{ draft = JSON.parse(localStorage.getItem(DKEY)); }catch(e){} }
    if(draft){ S = draft; render(); return; }
    fetch('./', {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
      var m = html.match(/<script type="application\/json" id="jt-config">([\s\S]*?)<\/script>/), cfg = null;
      try{ if(m && m[1].trim() !== 'null') cfg = JSON.parse(m[1]); }catch(e){}
      S = Object.assign(clone(DEF), cfg || {});
      S.khqr = Object.assign(clone(DEF.khqr), (cfg && cfg.khqr) || {});
      S.logo = S.logo || ''; S.name = S.name || 'Julian Topup';
    }).catch(function(){ S = clone(DEF); }).then(function(){ render(); });
  }
  load();
})();
</script>
